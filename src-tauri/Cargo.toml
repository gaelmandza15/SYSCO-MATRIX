[package]
name = "sysc-matrix"
version = "1.0.0"
description = "Matrice d'intégration Balance → DSF SYSCOHADA Révisé"
authors = ["SYSC"]
edition = "2021"

[lib]
name = "sysc_matrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.79"
printpdf = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
chrono = "0.4"

[features]
default = ["custom-protocol"]
# La feature custom-protocol est requise par Tauri v2 pour charger les assets
# embarqués dans le binaire en production.
custom-protocol = ["tauri/custom-protocol"]
